name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and generate static SEO pages
        run: npm run build
      - name: Add deployment commit metadata
        run: printf '{"commit":"%s"}\\n' "$GITHUB_SHA" > dist/deployment-info.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Verify published pages and SEO endpoints
        run: node scripts/verify-deployed-site.mjs
