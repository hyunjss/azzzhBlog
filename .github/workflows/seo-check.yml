name: SEO and lightweight build verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            baseline/package-lock.json
      - name: Build main baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build
      - name: Build feature branch
        run: |
          npm ci
          npm run build
      - name: Lint feature branch
        run: npm run lint
      - name: Verify SEO output
        run: node scripts/verify-seo-output.mjs
      - name: Compare build sizes
        run: node scripts/report-build-size.mjs baseline/dist dist
      - name: Install browser test and Lighthouse tools
        run: |
          npm install --no-save --package-lock=false playwright @lhci/cli
          npx playwright install --with-deps chromium
      - name: Start feature static preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/azzzh-preview.log 2>&1 &
          echo $! > /tmp/azzzh-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/azzzhBlog/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/azzzh-preview.log
          exit 1
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.mjs
      - name: Verify published-site contract against local preview
        env:
          SITE_URL: http://127.0.0.1:4173/azzzhBlog
        run: node scripts/verify-deployed-site.mjs
      - name: Start main baseline static preview
        run: |
          npm --prefix baseline run preview -- --host 127.0.0.1 --port 4174 > /tmp/azzzh-baseline-preview.log 2>&1 &
          echo $! > /tmp/azzzh-baseline-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/azzzhBlog/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/azzzh-baseline-preview.log
          exit 1
      - name: Run Lighthouse audits
        run: |
          ARTICLE_FILE="$(find dist/post -mindepth 2 -maxdepth 2 -name index.html | sort | head -n 1)"
          if [ -z "$ARTICLE_FILE" ]; then
            echo "No generated article HTML found in dist/post."
            exit 1
          fi
          ARTICLE_PATH="${ARTICLE_FILE#dist}"
          ARTICLE_URL="http://127.0.0.1:4173/azzzhBlog${ARTICLE_PATH}"
          echo "Checking Lighthouse article URL: $ARTICLE_URL"
          curl --fail --silent --show-error "$ARTICLE_URL" > /dev/null
          cat > /tmp/lighthouserc.json <<EOF
          {
            "ci": {
              "collect": {
                "url": [
                  "http://127.0.0.1:4174/azzzhBlog/",
                  "http://127.0.0.1:4173/azzzhBlog/",
                  "http://127.0.0.1:4173/azzzhBlog/about/",
                  "$ARTICLE_URL"
                ],
                "numberOfRuns": 3,
                "settings": {
                  "chromeFlags": "--no-sandbox"
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "lighthouse-reports"
              }
            }
          }
          EOF
          npx lhci autorun --config=/tmp/lighthouserc.json
      - name: Summarize Lighthouse metrics
        run: node scripts/report-lighthouse.mjs lighthouse-reports >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14
