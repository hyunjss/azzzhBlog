  <body>
    <div id="root"><main class="about-wrap"><div class="about"><a class="about__back" href="/azzzhBlog/">← 목록으로</a><h1>안녕하세요</h1><p class="about__intro">프론트엔드 개발자 <strong>hhyun</strong>입니다.<br />공부한 내용을 기록하고 공유하는 블로그입니다.</p><section class="about__section"><h2>기술 스택</h2><div class="about__skills"><span class="skill-badge">React</span><span class="skill-badge">TypeScript</span><span class="skill-badge">JavaScript</span><span class="skill-badge">HTML/CSS</span><span class="skill-badge">Vite</span></div></section><section class="about__section"><h2>주로 다루는 주제</h2><ul><li>프론트엔드 개발 (React, TypeScript)</li><li>CS 이론 (운영체제, 네트워크, 자료구조)</li><li>알고리즘 & 문제풀이</li></ul></section><section class="about__section"><h2>Links</h2><a href="https://github.com/hyunjss" target="_blank" rel="noreferrer" class="about__link">GitHub →</a></section></div></main></div>
  <script>
(() => {
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  const initialTheme = saved === "dark" ? "dark" : "light";
  root.setAttribute("data-theme", initialTheme);
  const themeButton = document.querySelector("[data-theme-toggle]");
  const setTheme = theme => {
    root.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (themeButton) themeButton.textContent = theme === "dark" ? "Light" : "Dark";
    const giscus = document.querySelector("iframe.giscus-frame");
    if (giscus) giscus.contentWindow?.postMessage({ giscus: { setConfig: { theme: theme === "dark" ? "dark" : "light" } } }, "https://giscus.app");
  };
  setTheme(initialTheme);
  const syncGiscusTheme = frame => {
    const send = () => frame.contentWindow?.postMessage({ giscus: { setConfig: { theme: root.getAttribute("data-theme") === "dark" ? "dark" : "light" } } }, "https://giscus.app");
    frame.addEventListener("load", send, { once: true });
    send();
  };
  const existingGiscus = document.querySelector("iframe.giscus-frame");
  if (existingGiscus) {
    syncGiscusTheme(existingGiscus);
  } else {
    const giscusObserver = new MutationObserver(() => {
      const frame = document.querySelector("iframe.giscus-frame");
      if (frame) { syncGiscusTheme(frame); giscusObserver.disconnect(); }
    });
    giscusObserver.observe(document.body, { childList: true, subtree: true });
  }
  themeButton?.addEventListener("click", () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  const sidebar = document.querySelector(".blog-sidebar");
  const sidebarToggle = document.querySelector("[data-sidebar-toggle]");
  const sidebarBackdrop = document.querySelector("[data-sidebar-backdrop]");
  const setSidebarOpen = open => {
    sidebar?.classList.toggle("blog-sidebar--open", open);
    if (sidebarBackdrop) sidebarBackdrop.hidden = !open;
  };
  sidebarToggle?.addEventListener("click", () => setSidebarOpen(!sidebar?.classList.contains("blog-sidebar--open")));
  sidebarBackdrop?.addEventListener("click", () => setSidebarOpen(false));
  const categoryButtons = [...document.querySelectorAll("[data-category]")];
  const posts = [...document.querySelectorAll("[data-post-category]")];
  const heading = document.querySelector("[data-category-heading]");
  const searchInput = document.querySelector("[data-post-search]");
  const emptyState = document.querySelector("[data-posts-empty]");
  const countNode = document.querySelector(".blog-list__count");
  let activeCategory = "전체";
  const updatePostList = () => {
    const terms = (searchInput?.value || "").trim().toLocaleLowerCase("ko-KR").split(/\s+/).filter(Boolean);
    posts.forEach(item => {
      const categoryMatches = activeCategory === "전체" || item.dataset.postCategory === activeCategory;
      const searchableText = item.dataset.searchText || "";
      const queryMatches = terms.every(term => searchableText.includes(term));
      item.hidden = !(categoryMatches && queryMatches);
    });
    const count = posts.filter(item => !item.hidden).length;
    if (countNode) countNode.textContent = count + "개의 노트";
    if (emptyState) {
      emptyState.hidden = count > 0;
      emptyState.textContent = terms.length ? "검색 결과가 없습니다." : "포스트가 없습니다.";
    }
  };
  searchInput?.addEventListener("input", updatePostList);
  categoryButtons.forEach(button => button.addEventListener("click", () => {
    activeCategory = button.dataset.category || "전체";
    setSidebarOpen(false);
    categoryButtons.forEach(item => item.classList.toggle("active", item === button));
    if (heading) heading.textContent = activeCategory;
    updatePostList();
  }));})();
</script></body>
